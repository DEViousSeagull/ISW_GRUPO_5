<form [formGroup]="formEntrada" (ngSubmit)="submitForm()" class="form-card">
    <h2>Compra de Entradas</h2>

    <div class="form-group">
        <label>Fecha de visita</label>
        <input type="date" formControlName="fechaVisita" (change)="actualizarEdades()" />
    </div>

    <div class="form-group">
        <label>Cantidad de entradas</label>
        <input type="number" formControlName="cantidadEntradas" (change)="actualizarEdades()" min="1" />
    </div>

    <div formArrayName="edades" class="form-group edades-group">
        <label>Edades de los visitantes</label>
        @for (edadCtrl of edades.controls; track $index; let i = $index) {

        <div class="edad-item">
            <input [formControlName]="i" type="number" placeholder="Edad {{ i + 1 }}" min="0" />
        </div>
        }
    </div>

    <div class="form-group">
        <label>Tipo de pase</label>
        <select formControlName="tipoPase">
            <option value="">Seleccione</option>
            <option value="regular">Regular</option>
            <option value="VIP">VIP</option>
        </select>
    </div>

    <div class="form-group">
        <label>Forma de pago</label>
        <select formControlName="formaPago">
            <option value="">Seleccione</option>
            <option value="efectivo">Efectivo</option>
            <option value="tarjeta">Tarjeta</option>
        </select>
    </div>

    <button type="submit" class="btn-comprar">Comprar</button>
</form>

@if (resumenCompraVisible) {
<div class="resumen-compra">
    <h3>Resumen de compra</h3>
    <p><strong>Cantidad de entradas:</strong> {{ cantidadEntradasResumen }}</p>
    <p><strong>Fecha de visita:</strong> {{ fechaResumen | date: 'dd/MM/yy' }}</p>
</div>
}
